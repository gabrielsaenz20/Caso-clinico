# ── Resumen / Abstract ────────────────────────────────────────────────────────
abstract:
  introduction_es: >
    La Angina de Ludwig es una celulitis indurada bilateral del suelo de la boca que, sin
    tratamiento oportuno, puede progresar a fascitis necrotizante cervical (FNC) con mortalidad
    del 15–40%. La diabetes mellitus (DM) es el principal factor de riesgo de progresión.
  introduction_en: >
    Ludwig's Angina is a bilateral indurated cellulitis of the floor of the mouth that, without
    timely treatment, can progress to cervical necrotizing fasciitis (CNF) with 15–40% mortality.
    Diabetes mellitus (DM) is the main risk factor for progression.

  case_es: "[AI_PENDIENTE: Redactar párrafo de presentación del caso resumiendo datos clave del paciente, hallazgos de laboratorio, cultivos y evolución (máx. 150 palabras)]"
  case_en: "[AI_PENDING: Write case presentation paragraph summarizing key patient data, laboratory findings, cultures and outcome (max 150 words)]"

  conclusions_label_es: "Conclusiones"
  conclusions_label_en: "Conclusions"
  conclusions_es: "[AI_PENDIENTE: Redactar conclusión del resumen en 2-3 oraciones]"
  conclusions_en: "[AI_PENDING: Write abstract conclusions in 2-3 sentences]"

  keywords_es: "Angina de Ludwig; fascitis necrotizante cervical; infección odontogénica; Klebsiella pneumoniae BLEE; diabetes mellitus; desbridamiento quirúrgico; meropenem; Hospital Eugenio Espejo."
  keywords_en: "Ludwig's Angina; cervical necrotizing fasciitis; odontogenic infection; ESBL Klebsiella pneumoniae; diabetes mellitus; surgical debridement; meropenem; Eugenio Espejo Hospital."


