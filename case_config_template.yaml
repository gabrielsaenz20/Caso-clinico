# ── Estudios de imagen ────────────────────────────────────────────────────────
imaging:
  section_title_es: "3. ESTUDIOS DE IMAGEN"
  section_title_en: "3. IMAGING STUDIES"

  # Grupos de imágenes (cada grupo = una subsección)
  image_groups:
    - id: sagital
      subsection_title_es: "3.1 Plano sagital — TAC simple de cuello y tórax"
      subsection_title_en: "3.1 Sagittal plane — non-contrast CT of neck and chest"
      narrative_es:
        - text: "La TAC simple de cuello y tórax (sin contraste) del 17/01/2026 reportó gas en región cervical bilateral y anterior, con colección en región pectoral izquierda. Los cortes sagitales (Figuras 1–3) demuestran gas en tejidos blandos cervicales, colección purulenta retrofaríngea y extensión infero-superior del proceso necrotizante desde C3 hasta la región supraclavicular."
        - text: "11,23"
          sup: true
      narrative_en:
        - text: "Non-contrast CT of the neck and chest (January 17, 2026) reported bilateral and anterior cervical gas with left pectoral collection. Sagittal CT sections (Figures 1–3) demonstrate soft tissue gas, retropharyngeal purulent collection, and inferosuperior extension of the necrotizing process from C3 to the supraclavicular region."
        - text: "11,23"
          sup: true
      # Lista de imágenes del grupo (se muestran en fila)
      images:
        - file: "tac1_sagital_gas.jpg"
          width_cm: 5.5
          caption_es: "TAC sagital (16/01/2026): gas retrofaríngeo (burbujas hipodensas) y colección purulenta cervical. Proceso necrotizante con gas difuso en tejidos blandos, signo patognomónico de FNC."
          caption_en: "Sagittal CT (16/01/2026): retropharyngeal gas (hypodense bubbles) and cervical purulent collection. Necrotizing process with diffuse soft tissue gas — pathognomonic sign of CNF."
        - file: "tac2_sagital_coleccion.jpg"
          width_cm: 5.5
          caption_es: "TAC sagital (16/01/2026): colección purulenta con múltiples burbujas de gas en espacios cervicales profundos. Extensión desde el espacio retrofaríngeo hacia el mediastino superior."
          caption_en: "Sagittal CT (16/01/2026): purulent collection with multiple gas bubbles in deep cervical spaces. Extension from the retropharyngeal space toward the superior mediastinum."
        - file: "tac3_sagital_extension.jpg"
          width_cm: 5.5
          caption_es: "TAC sagital (16/01/2026): extensión inferosuperior del proceso necrotizante cervical bilateral desde C3 hasta la región supraclavicular con compromiso del espacio peligroso."
          caption_en: "Sagittal CT (16/01/2026): inferosuperior extension of the bilateral cervical necrotizing process from C3 to the supraclavicular region with involvement of the danger space."

    - id: coronal
      subsection_title_es: "3.2 Plano coronal"
      subsection_title_en: "3.2 Coronal plane"
      narrative_es:
        - text: "Los cortes coronales (Figuras 4–6) muestran el absceso necrotizante cervical bilateral, gas difuso en los espacios fasciales profundos del cuello y la extensión hacia el mediastino superior."
        - text: "11,12"
          sup: true
      narrative_en:
        - text: "Coronal CT sections (Figures 4–6) show bilateral necrotizing cervical abscess, diffuse gas in the deep fascial spaces, and extension toward the superior mediastinum."
        - text: "11,12"
          sup: true
      images:
        - file: "tac4_coronal_absceso.jpg"
          width_cm: 5.5
          caption_es: "TAC coronal (16/01/2026): absceso necrotizante cervical bilateral. Ocupación de los espacios fasciales profundos con gas (hipodensidades puntiformes) en ambos lados del cuello."
          caption_en: "Coronal CT (16/01/2026): bilateral necrotizing cervical abscess with extension to deep fascial spaces. Note gas (punctiform hypodensities) on both sides of the neck."
        - file: "tac5_coronal_gas.jpg"
          width_cm: 5.5
          caption_es: "TAC coronal (16/01/2026): gas retrofaríngeo bilateral y engrosamiento difuso de tejidos blandos cervicales. Sin desplazamiento laríngeo ni extensión mediastínica al momento del estudio."
          caption_en: "Coronal CT (16/01/2026): bilateral retropharyngeal gas and diffuse cervical soft tissue thickening. No laryngeal displacement. No mediastinal extension at time of study."
        - file: "tac6_coronal_espacios.jpg"
          width_cm: 5.5
          caption_es: "TAC coronal (16/01/2026): compromiso bilateral de espacios fasciales profundos cervicales con gas y proceso inflamatorio difuso. Nótese la asimetría del proceso con mayor afectación derecha."
          caption_en: "Coronal CT (16/01/2026): bilateral deep cervical fascial space involvement with gas and diffuse inflammatory process. Greater involvement noted on the right side."

    - id: axial
      subsection_title_es: "3.3 Plano axial"
      subsection_title_en: "3.3 Axial plane"
      narrative_es:
        - text: "Los cortes axiales (Figuras 7 y 8) muestran la afectación bilateral de los espacios parafaríngeos y submandibulares con hipodensidades compatible con gas extrafascial — hallazgo patognomónico de FNC."
        - text: "10,11,23"
          sup: true
      narrative_en:
        - text: "Axial CT sections (Figures 7 and 8) show bilateral involvement of the parapharyngeal and submandibular spaces with hypodensities consistent with extrafascial gas — a pathognomonic finding of CNF."
        - text: "10,11,23"
          sup: true
      images:
        - file: "tac7_axial_parafaringeo.jpg"
          width_cm: 8
          caption_es: "TAC axial (16/01/2026): corte a nivel suprahioideo. Hipodensidades bilaterales en espacios parafaríngeos y masticadores compatibles con gas extrafascial, confirmando la naturaleza bilateral de la FNC."
          caption_en: "Axial CT (16/01/2026): suprahyoid level section. Bilateral hypodensities in parapharyngeal and masticator spaces consistent with extrafascial gas, confirming the bilateral nature of CNF."
        - file: "tac8_axial_submandibular.jpg"
          width_cm: 8
          caption_es: "TAC axial (16/01/2026): segundo corte a nivel suprahioideo. Afectación bilateral simétrica de los espacios fasciales profundos. La distribución bilateral confirma el diagnóstico de Angina de Ludwig complicada con FNC."
          caption_en: "Axial CT (16/01/2026): second suprahyoid section. Symmetric bilateral involvement of deep cervical fascial spaces. Bilateral distribution confirms the diagnosis of Ludwig's Angina complicated with CNF."

  key_findings:
    title_es: "3.4 Hallazgos imagenológicos clave"
    title_en: "3.4 Key imaging findings"
    ct_report_quote_es: 'Reporte TAC simple de cabeza, cuello y tórax (17/01/2026): "Gas en región cervical derecha, izquierda y anterior. No aparenta mediastinitis. Gas y colección en región pectoral izquierda. Sin invasión ni desplazamiento de vía aérea."'
    ct_report_quote_en: 'Official CT report (January 16, 2026): "Necrotizing abscess of the cervical region with cutaneous fistulas producing fetid purulent drainage. No laryngeal invasion or displacement observed."'
    findings_intro_es: "Los hallazgos tomográficos que fundamentaron la indicación de desbridamiento urgente:"
    findings_intro_en: "Key CT findings supporting the indication for urgent debridement:"
    findings_bullets_es:
      - "Gas en tejidos blandos cervicales en múltiples planos (sagital y coronal) — hallazgo patognomónico de FNC."
      - "Colección purulenta retrofaríngea con extensión de C3 a región supraclavicular."
      - "Compromiso bilateral de espacios fasciales profundos sin extensión mediastínica al momento del estudio."
      - "Ausencia de desplazamiento laríngeo — vía aérea no comprometida directamente por la colección."
    findings_bullets_en:
      - "Soft tissue gas in multiple planes (sagittal and coronal) — pathognomonic sign of CNF."
      - "Retropharyngeal purulent collection extending from C3 to the supraclavicular region."
      - "Bilateral deep cervical fascial space involvement without mediastinal extension at time of study."
      - "No laryngeal displacement — airway not directly compromised by the collection."

  clinical_photo:
    title_es: "3.5 Imagen clínica al ingreso HEEE (17/01/2026)"
    title_en: "3.5 Clinical photograph on HEEE admission (January 17, 2026)"
    intro_es: "La Figura 9 documenta la extensión de la necrosis cervical, la escara oscura característica de la FNC y las fístulas activas con drenaje purulento al momento de la evaluación en el HEEE."
    intro_en: "Figure 9 documents the extent of cervical necrosis, the characteristic dark eschar of CNF, and the active fistulas with purulent drainage on evaluation at HEEE."
    file: "fig2_preop_necrosis_jan17.jpg"
    width_cm: 10
    caption_es: "Fotografía clínica al ingreso HEEE (17/01/2026). Necrosis tisular extensa de región cervical anterior y lateral con escara oscura, tejido fibrinoide y fístulas cutáneas activas con drenaje purulento fétido. Paciente con cánula nasal de O₂ y drenaje cervical colocado. Edema submandibular bilateral marcado."
    caption_en: "Clinical photograph on HEEE admission (January 17, 2026). Extensive tissue necrosis of anterior and lateral cervical region with dark eschar, fibrinoid tissue areas, and active cutaneous fistulas with fetid purulent drainage. Patient with nasal O₂ cannula and cervical drain. Bilateral submandibular edema."


# ── Evaluación multidisciplinaria ─────────────────────────────────────────────
multidisciplinary:
  subsections:
    - id: referral
      title_es: "4.1 Proceso de referencia y recepción"
      title_en: "4.1 Referral and reception"
      text_es: "La paciente fue referida por la Dra. Patricia Verónica Morales Cabezas (Especialista en Medicina de Emergencias, SENESCYT: 1027-2017-1891207) desde el Hospital Dr. Gustavo Domínguez Zambrano al HEEE. Traslado en ambulancia SVA terrestre el 16/01/2026 a las 07:00 h. Recibida por la Dra. Mariuxi Báez Moreira."
      text_en: "Referred by Dr. Patricia Verónica Morales Cabezas (Emergency Medicine Specialist, SENESCYT: 1027-2017-1891207) from Hospital Dr. Gustavo Domínguez Zambrano to HEEE. ALS ground transfer January 16, 2026 at 07:00 h. Received by Dr. Mariuxi Báez Moreira."

    - id: orl
      title_es: "4.2 Equipo ORL — HEEE"
      title_en: "4.2 ORL team — HEEE"
      text_es: "El Servicio de Otorrinolaringología del HEEE evaluó a la paciente al ingreso e identificó Angina de Ludwig complicada con FNC bilateral como emergencia quirúrgica de primer orden, con indicación de desbridamiento radical urgente."
      text_en: "The Otorhinolaryngology Department team at HEEE evaluated the patient on admission and identified Ludwig's Angina complicated with bilateral CNF as a first-order surgical emergency requiring urgent radical debridement."

    - id: anesthesia
      title_es: "4.3 Anestesiología"
      title_en: "4.3 Anesthesiology"
      parts_es:
        - text: "El edema cervical masivo y el trismus funcional requirieron protocolo de vía aérea difícil prevista. La intubación orotraqueal se realizó exitosamente bajo anestesia general (confirmada por cultivo de secreción traqueal del 18/01/2026). Clasificación ASA: III."
        - text: "14"
          sup: true
      parts_en:
        - text: "Massive cervical edema and functional trismus required a predicted difficult airway protocol. Orotracheal intubation performed successfully under general anesthesia (confirmed by tracheal secretion culture, January 17, 2026). ASA classification: III."
        - text: "14"
          sup: true

    - id: icu
      title_es: "4.4 UCI"
