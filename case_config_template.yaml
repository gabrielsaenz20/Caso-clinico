            caption_es: "Evolución posquirúrgica (POD 6, 24/01/2026): acercamiento de la traqueostomía cervical con cánula in situ, suturas de afrontamiento y tejido de granulación incipiente en los bordes de la herida."
            caption_en: "Postoperative evolution (POD 6, January 24, 2026): close-up of cervical tracheostomy with cannula in place, approximation sutures and incipient granulation tissue at wound margins."
      - images:
          - file: "fig5a_control_cervical_mar30.jpg"
            width_cm: 5.5
            caption_es: "Control ambulatorio (~POD 71, 30/03/2026): defecto cervical submandibular con tejido de granulación activo y defecto infraclavicular derecho en proceso de cierre por segunda intención."
            caption_en: "Outpatient follow-up (~POD 71, March 30, 2026): submandibular cervical defect with active granulation tissue and right infraclavicular defect healing by secondary intention."
          - file: "fig5b_control_infraclavicular_mar30.jpg"
            width_cm: 5.5
            caption_es: "Control ambulatorio (30/03/2026): acercamiento del defecto infraclavicular con tejido de granulación activo, bordes bien definidos sin signos de infección activa."
            caption_en: "Outpatient follow-up (March 30, 2026): close-up of infraclavicular defect with active granulation tissue, well-defined edges, and no signs of active infection."
          - file: "fig5c_control_panoramico_mar31.jpg"
            width_cm: 5.5
            caption_es: "Control ambulatorio (31/03/2026): vista panorámica cervical con evolución favorable del defecto. Granulación activa en resolución. Cicatrización por segunda intención en curso."
            caption_en: "Outpatient follow-up (March 31, 2026): panoramic cervical view showing favorable defect evolution. Active granulation in resolution. Healing by secondary intention ongoing."

  complications:
    title_es: "6.5 Complicaciones posoperatorias"
    title_en: "6.5 Postoperative complications"
    items_es:
      - label: "Hipoxemia aguda (POD 5, 23/01): "
        text: "SatO2 85,7%, PaO2 47,9 mmHg, Dímero D 1,27 µg/mL. Compatible con atelectasia o neumonía aspirativa."
      - label: "Hiponatremia e hipopotasemia recurrentes: "
        text: "Na mín. 129 mEq/L, K mín. 2,9 mEq/L. Corrección progresiva con reposición IV."
      - label: "Candiduria nosocomial (POD 17, 04/02): "
        text: "Candida spp. levaduras +++ / hifas +++. Tratada con fluconazol 150 mg IV c/24 h por 14 días con resolución favorable."
      - label: "Eosinofilia progresiva: "
        text: "Hasta 18,7% (09/02). Compatible con reacción a antibioticoterapia prolongada."
      - label: "Anemia de enfermedad crónica: "
        text: "Hb 8,2–12,0 g/dL durante toda la hospitalización."
    items_en:
      - label: "Acute hypoxemia (POD 5, January 23): "
        text: "SpO2 85.7%, PaO2 47.9 mmHg, D-dimer 1.27 µg/mL. Compatible with atelectasis or aspiration pneumonia."
      - label: "Recurrent hyponatremia and hypokalemia: "
        text: "Minimum Na 129 mEq/L, K 2.9 mEq/L. Progressive IV correction."
      - label: "Nosocomial candiduria (POD 17, February 4): "
        text: "Candida spp. yeast +++ / hyphae +++. Treated with fluconazole 150 mg IV q24h for 14 days with favorable resolution."
      - label: "Progressive eosinophilia: "
        text: "Up to 18.7% (February 9). Compatible with drug reaction to prolonged antibiotherapy."
      - label: "Persistent anemia of chronic disease: "
        text: "Hb 8.2–12.0 g/dL throughout hospitalization."


