discussion:
  differential_dx_table:
    title_es: "Diagnóstico diferencial de las infecciones cervicofaciales profundas"
    title_en: "Differential diagnosis of deep cervicofacial infections"
    headers_es: ["Entidad", "Características clínicas", "Hallazgos imagenológicos", "Manejo"]
